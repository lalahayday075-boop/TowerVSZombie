<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Tower vs Zombie</title>
<link rel="stylesheet" href="assets/style.css" />
<link rel="stylesheet" href="assets/gacha.css" />
<link rel="stylesheet" href="assets/evolve.css" />
<link rel="stylesheet" href="assets/player.css" />
<link rel="stylesheet" href="assets/zombieskins.css" />
<style>
  body { margin: 0; background: #111; color: #fff; font-family: sans-serif; }
  body { user-select: none; -webkit-user-select: none; -ms-user-select: none;
         -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { user-select: none; touch-action: none; }
  #ui { padding: 8px; background: #222; text-align: center; }
  #game { background: #333; display: block; margin: auto; }
  button { padding: 6px 10px; }
</style>
</head>
<body>

<button id="gachaBtn">🎰 กาชา</button>
<button id="profileBtn">👤 โปรไฟล์</button>
<button id="setBtn">⚙ ตั้งค่า</button>

<div id="ui">
  <div>
    💰 เงิน: <span id="money">100</span>
    | 💎 เพชร: <span id="diamond">0</span>
  </div>
  <div>
    ด่าน: <span id="wave">1</span>
    | เวลา: <span id="time">60</span>s
    |🧟 เหลือ: <span id="zombieLeft">0</span>
    <span id="mode"></span>
  </div>
</div>

<div id="towerPopup">
  <div class="tower-popup-panel">
    <h3>เลือกป้อม</h3>
    <div id="towerList" class="tower-list"></div>
    <button class="popup-close" id="towerPopupCloseBtn">ปิด</button>
  </div>
</div>

<div id="towerInspectPopup" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:20;">
  <div style="background:#1e1e1e;margin:80px auto;padding:14px;width:320px;border-radius:10px;">
    <h3 id="inspectTitle">Tower</h3>
    <div id="inspectStats"></div>
  </div>
</div>

<button id="evolveBtn">🧬 อีโว</button>

<div id="gachaPage" class="gacha-overlay">
  <div id="gachaContainer" class="gacha-box"></div>
</div>

<canvas id="game" width="400" height="775"></canvas>

<script type="module" src="src/main.js"></script>
</body>
</html>
