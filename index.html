<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Tower vs Zombie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css" />
<link rel="stylesheet" href="assets/style.css" />
<link rel="stylesheet" href="assets/gacha.css" />
<link rel="stylesheet" href="assets/evolve.css" />
<link rel="stylesheet" href="assets/player.css" />
<link rel="stylesheet" href="assets/zombieskins.css" />
</head>
<body>

<!-- ===== HUD บนสุด ===== -->
<header id="hud">
  <div class="hud-resources">
    <div class="hud-pill hud-pill--money"><span class="hud-icon">💰</span><span id="money">100</span></div>
    <div class="hud-pill hud-pill--diamond"><span class="hud-icon">💎</span><span id="diamond">0</span></div>
  </div>
  <div class="hud-wave">
    <div class="hud-wave-main">
      <span class="hud-wave-label">ด่าน</span><span id="wave" class="hud-wave-value">1</span>
    </div>
    <div class="hud-wave-sub">
      <span class="hud-chip">⏱ <span id="time">60</span>s</span>
      <span class="hud-chip">🧟 <span id="zombieLeft">0</span></span>
      <span id="mode" class="hud-mode"></span>
    </div>
  </div>
</header>

<!-- ===== พื้นที่เกม ===== -->
<div id="gameStage">
  <canvas id="game" width="400" height="775"></canvas>
</div>

<!-- ===== แถบเมนูล่าง ===== -->
<nav id="bottomDock">
  <button id="gachaBtn" class="dock-btn"><span class="dock-icon">🎰</span><span class="dock-label">กาชา</span></button>
  <button id="evolveBtn" class="dock-btn"><span class="dock-icon">🧬</span><span class="dock-label">อีโว</span></button>
  <button id="profileBtn" class="dock-btn"><span class="dock-icon">👤</span><span class="dock-label">โปรไฟล์</span></button>
  <button id="setBtn" class="dock-btn"><span class="dock-icon">⚙️</span><span class="dock-label">ตั้งค่า</span></button>
</nav>

<!-- ===== เลือกป้อม (ตอนวางป้อมใหม่) ===== -->
<div id="towerPopup">
  <div class="tower-popup-panel">
    <h3>เลือกป้อม</h3>
    <div id="towerList" class="tower-list"></div>
    <button class="popup-close" id="towerPopupCloseBtn">ปิด</button>
  </div>
</div>

<!-- ===== ตรวจสอบ/อัปเกรดป้อม ===== -->
<div id="towerInspectPopup" style="display:none;">
  <div class="tower-inspect-panel">
    <h3 id="inspectTitle">Tower</h3>
    <div id="inspectStats"></div>
  </div>
</div>

<!-- ===== กาชา ===== -->
<div id="gachaPage" class="gacha-overlay">
  <div id="gachaContainer" class="gacha-box"></div>
</div>

<script type="module" src="scr/main.js"></script>
<script src="scr/core/canvasResize.js"></script>
<script src="scr/core/viewportLock.js"></script>
</body>
</html>
